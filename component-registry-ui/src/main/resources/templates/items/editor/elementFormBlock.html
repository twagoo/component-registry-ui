<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>
            <div th:fragment="elementBlock(element, basePath)">
                <div th:object="${element}" class="cmd-element border-start p-2"
                     th:with="fieldsDivId=|${basePath}_fields|">

                    <div class="editor-section-header container">
                        <div class="row">
                            <div class="col-xl-9 h4"
                                 data-bs-toggle="collapse" 
                                 th:href="|#${fieldsDivId}|">
                                Element: [[*{name}]]
                            </div>

                            <div class="col-xl-3 text-xl-end">
                                <div th:replace="~{items/editor/editorComponents :: blockEditControls}">
                                    [delete, move]
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="collapse" th:id="${fieldsDivId}">
                        <div class="card card-body m-2">
                            <fieldset class="p-1" th:each="field : ${ {'name', 'conceptLink'} }">
                                <div th:with="path=|${basePath}.${field}|">
                                    <label th:for="${path}" class="form-label">
                                        [[${field}]]
                                    </label>
                                    <input class="form-control"
                                           th:id="${path}"
                                           th:name="${path}"
                                           th:value="${element[field]}" />
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
