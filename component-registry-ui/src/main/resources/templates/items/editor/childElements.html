<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Child elements</title>
    </head>

    <body>
        <main>
            <!-- Child elements section for components -->
            <div th:fragment="childElements(elements, basePath, parentId)">
                <span class="h3 visually-hidden">Elements</span>
                <div class="p-2 visually-hidden" th:if="${#lists.size(elements) == 0}">
                    No elements
                </div>

                <div class="ms-2" 
                     th:each="element, iterStat : ${elements}">
                    <!--/* Element form block */-->
                    <div th:replace="~{items/editor/elementFormBlock :: elementBlock(
                         element = ${element}, 
                         basePath = |${basePath}.element[${iterStat.index}]|,
                         parentId = ${fieldsDivId},
                         iterStat = ${iterStat})}">
                    </div>
                </div>

                <div class="px-2">
                    <!--/* Add element button */-->
                    <div th:replace="~{/items/editor/transformationControls 
                         :: addChildElementButton(path = ${basePath}, parentId=${parentId})}">
                    </div>
                </div>
            </div> <!-- end fragment: childElements -->
        </main>
    </body>
</html>
