<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>

            <div class="container">

                <h2>Specification</h2>

                <form id="item-description-form" 
                      th:object="${description}">
                    <div class="mb-3">
                        <label for="item-name" class="form-label"
                               th:text="#{editor.form.item.name}"></label>
                        <input id="item-name" 
                               class="form-control"
                               th:value="*{name}" />
                    </div>
                    <div class="mb-3">
                        <label for="item-description" class="form-label"
                               th:text="#{editor.form.item.description}"></label>
                        <textarea id="item-description"
                                  class="form-control"
                                  th:text="*{description}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>


            </div>
        </main>
    </body>
</html>
