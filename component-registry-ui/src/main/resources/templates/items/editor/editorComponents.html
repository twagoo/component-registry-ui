<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Shared components</title>
    </head>

    <body>
        <main>

            <div th:fragment="blockEditControls(path, parentId, itemName, type, canMoveUp, canMoveDown)"
                 th:with="TransformationActions=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions)}">
                <a href="#" class="btn btn-outline-danger" title="Delete"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.DELETE},
                   path=${path})}"
                   th:hx-target="|#${parentId}|"
                   th:hx-select="|#${parentId}|"
                   th:hx-confirm="|Delete ${itemName}?|">
                    <i class="fa-solid fa-trash"></i>
                    <span class="visually-hidden">Delete</span>
                </a>

                <a href="#" class="btn btn-outline-primary" title="Move up"
                   th:classAppend="${canMoveUp ? '' : 'disabled opacity-25'  }"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.moveUpActionFor(type)},
                   path=${path})}"
                   th:hx-target="|#${parentId}|"
                   th:hx-select="|#${parentId}|">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span class="visually-hidden">Move up</span>
                </a>

                <a href="#" class="btn btn-outline-primary" title="Move down"
                   th:classAppend="${canMoveDown ? '' : 'disabled opacity-25'  }"
                   th:hx-post="@{/editor/transform(
                   operation=${TransformationActions.moveDownActionFor(type)},
                   path=${path})}"
                   th:hx-target="|#${parentId}|"
                   th:hx-select="|#${parentId}|">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span class="visually-hidden">Move down</span>
                </a>
            </div>

        </main>
    </body>
</html>
