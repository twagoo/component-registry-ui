<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>

            <div class="container">

                <div  id="spec-form">
                    <form th:object="${spec}"
                          th:action="@{/editor/{componentId}/spec(componentId=${description.id})}"
                          method="post">
                        <fieldset th:each="topComponent : *{component}">
                            <div class="mb-3">
                                <label for="spec-name" class="form-label"
                                       th:text="Name"></label>
                                <pre th:text="${topComponent.name}"></pre>
<!--                                <input 
                                    class="form-control"
                                    th:field="${component.name}" />-->

                                <div class="ms-2" 
                                     th:each="childComponent : *{component.component}">
                                    <div th:replace="~{items/editor/componentFormBlock :: componentBlock(${childComponent})}"
<!--                                    <h4>Component</h4>
                                    <pre th:text="${childComponent.name}"></pre>
                                    <div class="mb-3">
                                        <label class="form-label"
                                               th:text="Name"></label>
                                                                                <input 
                                                                                    class="form-control"
                                                                                    th:field="*{childComponent.name}" />
                                    </div>-->
                                </div>
                            </div>
                        </fieldset>
                        <button type="submit" 
                                class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
