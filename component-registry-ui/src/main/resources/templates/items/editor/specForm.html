<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>Editor</title>
    </head>

    <body>
        <main>

            <div class="container">

                <h2>Specification</h2>

                <form id="spec-form" 
                      th:object="${spec}"
                      th:action="@{/editor/{componentId}/spec(componentId=${description.id})}"
                      method="post">
                    <fieldset th:each="component: ${spec.component}">
                        <th:block th:object="${component}">
                            <div class="mb-3">
                                <label for="spec-name" class="form-label"
                                       th:text="Name"></label>
                                <input id="spec-name" 
                                       class="form-control"
                                       th:field="${spec.component.name}" />
                            </div>
                        </th:block>
                    </fieldset>
                    <button type="submit" 
                            class="btn btn-primary">Submit</button>
                </form>


            </div>
        </main>
    </body>
</html>
