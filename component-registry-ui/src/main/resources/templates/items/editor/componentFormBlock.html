<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>
            <div th:fragment="componentBlock(thisComponent)" class="border p-1">
                <h4>Component: <span th:text="${thisComponent.name}"></span></h4>

                <div class="mb-2">
                    <label class="form-label"
                           th:text="Name"></label>
                    <input 
                        class="form-control"
                        th:value="${thisComponent.name}" />
                </div>

                <div class="my-2 ms-2" 
                     th:each="childComponent : ${thisComponent.component}">
                    <div th:replace="~{items/editor/componentFormBlock :: componentBlock(${childComponent})}"></div>
                </div>
        </main>
    </body>
</html>
