<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>
            <div th:fragment="componentBlock(component, basePath)">
                <div th:object="${component}" class="p-1">
                    <h4>Component: <span th:text="*{name}"></span></h4>

                    <fieldset class="border p-1" th:each="field : ${ {'name', 'conceptLink'} }">
                        <div th:with="path=${basePath+'.'+field}">
                            <label th:for="${path}" class="form-label">
                                [[${path}]]
                            </label>
                            <input 
                                class="form-control"
                                th:name="${path}"
                                th:value="${component[field]}" />
                        </div>
                    </fieldset>

                    <div class="ms-2" 
                         th:each="childComponent, iterStat : ${component.component}"
                         th:with="path = ${basePath+'.component[' +iterStat.index + ']'}">
                        <div th:replace="~{items/editor/componentFormBlock :: componentBlock(${childComponent}, ${path})}">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
