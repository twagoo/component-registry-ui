<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Editor</title>
    </head>

    <body>
        <main>
            <div th:fragment="componentRef(component, basePath, parentId, iterStat)"
                 th:with="componentDivId=|${#strings.replace(#strings.replace(#strings.replace(basePath,'[','---'),']','---'),'.','---')}_ref|,
                 titleId=|title_${#strings.replace(#strings.replace(component.componentRef,':','_'),'.','_')}|">
                <div th:object="${component}" th:id="${componentDivId}" class="cmd-component border-start p-2">

                    <div class="editor-section-header container">
                        <div class="row">
                            <div th:id="${titleId}" class="col-xl-9 h4">
                                Component reference: (..)
                            </div>

                            <div class="col-xl-3 text-xl-end">
                                <div th:replace="~{/editor/fragments/transformationControls 
                                     :: blockEditControls(
                                     type = 'Component',
                                     path = ${basePath}, 
                                     parentId = ${parentId},
                                     itemName = |component '${component.name}'|,
                                     canMoveUp = ${iterStat.index &gt; 0},
                                     canMoveDown = ${iterStat.index &lt; iterStat.size - 1})}">
                                    [delete, move]
                                </div>
                            </div>
                        </div>
                    </div>
                    <span>[[*{componentRef}]]</span>


                    <th:block th:each="field : ${ {'name', 'componentRef'} }"
                              th:with="path=|${basePath}.${field}|">
                        <input type="hidden" 
                               th:name="${path}"
                               th:value="${component[field]}"/> 
                    </th:block>

                    <div href="#" 
                         th:hx-get="@{/editor/referencedComponent/{id}(id=${component.componentRef})}"
                         hx-select="#details"
                         th:hx-select-oob="|#${titleId}|"
                         hx-trigger="load">
                        <!--/* load referenced component details */-->
                    </div>

                </div>
            </div>
        </main>

        <th:block th:remove="all">
            <div th:fragment="expandedComponent"
                 th:with="titleId=|title_${#strings.replace(#strings.replace(spec.header.id,':','_'),'.','_')}|">
                <div th:id="${titleId}" class="col-xl-9 h4">
                    Component reference: [[${spec.header.name}]]
                </div>

                <div id="details">
                    (details)
                    <!--<pre th:text="${spec}"></pre>-->
                </div>
            </div>
        </th:block>
    </body>
</html>
