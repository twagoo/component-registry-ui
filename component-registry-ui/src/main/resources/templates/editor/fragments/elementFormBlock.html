<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Element form</title>
    </head>

    <body>
        <main>
            <div th:fragment="elementBlock(element, basePath, parentId, iterStat)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)}">
                <div th:object="${element}" class="cmd-element p-2"
                     th:with="headerId=|${TemplateUtils.makeIdSafe(basePath)}_header|,
                     fieldsDivId=|${TemplateUtils.makeIdSafe(basePath)}_fields|"
                     th:id="${itemId}">

                    <div class="editor-section-header container" th:id="${headerId}">
                        <div class="row">
                            <div class="col-xl-9 h4"
                                 data-bs-toggle="collapse" 
                                 th:href="|#${fieldsDivId}_outer|">
                                Element: [[*{name}]]
                            </div>

                            <div class="col-xl-3 text-xl-end">
                                <!--/* Delete - Move up - Move down */-->
                                <div th:replace="~{/editor/fragments/transformationControls 
                                     :: blockEditControls(
                                     type = 'Element',
                                     path = ${basePath}, 
                                     parentId = ${parentId},
                                     itemName = |element '${element.name}'|,
                                     canMoveUp = ${iterStat.index &gt; 0},
                                     canMoveDown = ${iterStat.index &lt; iterStat.size - 1})}">
                                    [delete, move]
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="collapse" th:id="|${fieldsDivId}_outer|">
                        <div  th:id="${fieldsDivId}">
                            <div class="card card-body m-2">
                                <!--/* Element property fields */-->
                                <th:block th:each="field : ${
                                          {
                                          'name', 
                                          'conceptLink', 
                                          'documentation',
                                          'cardinalityMin',
                                          'cardinalityMax'
                                          }}">
                                    <fieldset th:replace="~{/editor/fragments/formProperties :: fieldSet(
                                              field=${field},
                                              fieldPath=|${basePath}.${field}|,
                                              fieldValue=${element[field]},
                                              headerId=${headerId})}">
                                        <!--/* Label + form control for each field */-->
                                    </fieldset>
                                </th:block>
                            </div>

                            <!--/* Child attributes */-->
                            <div class="p-2">
                                <div th:replace="~{/editor/fragments/childAttributes :: childAttributes(
                                     attributeList = ${element.attributeList},
                                     basePath = ${basePath}, 
                                     parentId = ${fieldsDivId}, 
                                     parentType = 'Element')}"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
