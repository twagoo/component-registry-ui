<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Form properties</title>
    </head>

    <body>
        <main>

            <fieldset th:fragment="fieldSet(field, fieldPath, fieldValue, headerId)" 
                      class="p-1" >
                <label th:for="${fieldPath}" 
                       class="form-label" 
                       th:text="#{|editor.form.field.${field}|}">
                    [Field label]
                </label>
                <th:block th:switch="${field}">
                    <div th:case="name" >
                        <input class="form-control"
                               th:id="${fieldPath}"
                               th:name="${fieldPath}"
                               th:value="${fieldValue}"
                               th:hx-post="@{/editor/transform(
                               operation=${T(eu.clarin.cmdi.componentregistry.ui.service.TransformationActions).NOOP},
                               path=${path},
                               itemId=${rootComponentId}, uniqId=${#strings.randomAlphanumeric(6)})}"
                               th:hx-target="|#${headerId}|"
                               th:hx-select="|#${headerId}|"
                               hx-swap="outerHTML"/>
                    </div>

                    <div th:case="documentation">
                        <div th:replace="~{/editor/fragments/documentation :: documentation(path = ${fieldPath}, value=${fieldValue})}"></div>
                    </div>

                    <div th:case="*" >
                        <input class="form-control"
                               th:id="${fieldPath}"
                               th:name="${fieldPath}"
                               th:value="${fieldValue}" />
                    </div>
                </th:block>
            </fieldset>
        </main>
    </body>
</html>
