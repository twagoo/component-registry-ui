<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Element form</title>
    </head>

    <body>
        <main>
            <div th:fragment="documentation(fieldPath, value)">
                <div th:each="doc, iterStat : ${value}"
                     th:with="path = |${fieldPath}[${iterStat.index}]|">
                    <input class="form-control"
                           th:id="|${path}.lang|"
                           th:name="|${path}.lang|"
                           th:value="${doc.lang}" />
                    <input class="form-control"
                           th:id="|${path}.value|"
                           th:name="|${path}.value|"
                           th:value="${doc.value}" />
                </div>
                <!-- TODO: control to add more documentation -->
            </div>
        </main>
    </body>
</html>
