<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Attribute form</title>
    </head>

    <body>
        <main>
            <div th:fragment="attributeBlock(attribute, basePath, parentId, iterStat)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)}">
                <div th:object="${attribute}" class="cmd-attribute p-2"
                     th:with="fieldsDivId=|${TemplateUtils.makeIdSafe(basePath)}_fields|">

                    <div class="editor-section-header container">
                        <div class="row">
                            <div class="col-xl-9 h4"
                                 data-bs-toggle="collapse" 
                                 th:href="|#${fieldsDivId}_outer|">
                                Attribute: [[*{name}]]
                            </div>

                            <div class="col-xl-3 text-xl-end">
                                <!--/* Delete - Move up - Move down */-->
                                <div th:replace="~{/editor/fragments/transformationControls 
                                     :: blockEditControls(
                                        type = 'Attribute',
                                        path = ${basePath}, 
                                        parentId = ${parentId},
                                        itemName = |attribute '${attribute.name}'|,
                                        canMoveUp = ${iterStat.index &gt; 0},
                                        canMoveDown = ${iterStat.index &lt; iterStat.size - 1})}">
                                    [delete, move]
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="collapse" th:id="|${fieldsDivId}_outer|">
                        <div  th:id="${fieldsDivId}">
                            <div class="card card-body m-2">
                                <!--/* Attribute property fields */-->
                                <fieldset class="p-1" th:each="field : ${ {'name', 'conceptLink'} }">
                                    <div th:with="fieldPath=|${basePath}.${field}|">
                                        <label th:for="${fieldPath}" class="form-label">
                                            [[${field}]]
                                        </label>
                                        <input class="form-control"
                                               th:id="${fieldPath}"
                                               th:name="${fieldPath}"
                                               th:value="${attribute[field]}" />
                                    </div>
                                </fieldset>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
