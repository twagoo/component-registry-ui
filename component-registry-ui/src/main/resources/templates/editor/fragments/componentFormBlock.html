<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Component form</title>
    </head>

    <body>
        <main>

            <!--/* The "component block" with actions and (de)collapse header */-->
            <div th:fragment="componentBlock(component, basePath, parentId, iterStat)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)}">
                <div th:object="${component}" class="cmd-component p-2"
                     th:with="fieldsDivId=|${TemplateUtils.makeIdSafe(basePath)}_fields|">

                    <div class="editor-section-header container">
                        <div class="row">
                            <div class="col-xl-9 h4"
                                 data-bs-toggle="collapse"
                                 th:href="|#${fieldsDivId}_outer|">
                                Component: [[*{name}]]
                            </div>

                            <div class="col-xl-3 text-xl-end">
                                <!--/* Delete - Move up - Move down */-->
                                <div th:replace="~{/editor/fragments/transformationControls 
                                     :: blockEditControls(
                                     type = 'Component',
                                     path = ${basePath}, 
                                     parentId = ${parentId},
                                     itemName = |component '${component.name}'|,
                                     canMoveUp = ${iterStat.index &gt; 0},
                                     canMoveDown = ${iterStat.index &lt; iterStat.size - 1})}">
                                    [delete, move]
                                </div>
                            </div>
                        </div>
                    </div>

                    <!--/* The "component content block" */-->
                    <div class="collapse" th:id="|${fieldsDivId}_outer|">
                        <th:block th:fragment="componentBlockContent(component, basePath, fieldsDivId)">
                            <div class="component-content" th:id="${fieldsDivId}">
                                <!--/* The form part */-->
                                <div class="card card-body m-2">
                                    <!--/* Component property fields */-->
                                    <fieldset class="p-1" th:each="field : ${ {'name', 'conceptLink'} }">
                                        <div th:with="fieldPath=|${basePath}.${field}|">
                                            <label th:for="${fieldPath}" class="form-label">
                                                [[${field}]]
                                            </label>
                                            <input class="form-control"
                                                   th:id="${fieldPath}"
                                                   th:name="${fieldPath}"
                                                   th:value="${component[field]}" />
                                        </div>
                                    </fieldset>
                                </div>

                                <!--/* Children: Attributes */-->
                                <div class="p-2"
                                     th:insert="~{/editor/fragments/childAttributes :: childAttributes(
                                     attributeList = ${component.attributeList},
                                     basePath = ${basePath}, 
                                     parentId = ${fieldsDivId}, 
                                     parentType = 'Component')}">
                                </div>

                                <!--/* Children: Elements */-->
                                <div class="p-2"
                                     th:insert="~{/editor/fragments/childElements :: childElements(
                                     elements = ${component.element},
                                     basePath = ${basePath}, 
                                     parentId = ${fieldsDivId})}">
                                </div>

                                <!--/* Children: Components */-->
                                <div class="p-2"
                                     th:insert="~{/editor/fragments/childComponents :: childComponents(
                                     components = ${component.component},
                                     basePath = ${basePath}, 
                                     parentId = ${fieldsDivId})}">
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
