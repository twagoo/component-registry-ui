<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Value scheme</title>
    </head>

    <body>
        <main>
            <div th:fragment="valueScheme(
                 parentPath, 
                 valueSchemeAttributePath, valueSchemeAttributeValue, 
                 valueSchemePath, valueSchemeValue)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)},
                 containerId = |${TemplateUtils.makeIdSafe(path)}_valueScheme|">
                <div class="valuescheme-container" th:id="${containerId}">

                    <fieldset class="p-1" th:with="
                              baseId=${TemplateUtils.makeIdSafe(basePath)},
                              previewId=|${baseId}_valueSchemePreview|,
                              modalId=|${baseId}_valueSchemeModel|">
                        <label th:for="${previewId}" class="form-label">Type</label>
                        <div class="input-group">
                            <input type="hidden" th:name="${valueSchemeAttributePath}" th:value="${valueSchemeAttributeValue}" 
                                   th:if="${valueSchemeAttributeValue} != null" />
                            <input type="hidden" th:name="${valueSchemePath}" th:value="${valueSchemeValue}" 
                                   th:if="${valueSchemeValue} != null" />

                            <!-- TODO: render representation of selected value scheme -->
                            <input class="form-control" th:id="${previewId}" type="text" th:value="${valueSchemeAttributeValue}" disabled="disabled" />

                            <button
                                class="btn btn-primary" th:hx-post="@{/editor/valueSchemeEditor(path=${basePath})}"
                                data-bs-toggle="modal"
                                hx-trigger="click"
                                th:hx-target="|#${modalId}"
                                th:data-bs-target="|#${modalId}">Edit</button>

                            <div th:id="${modalId}"
                                 class="modal modal-blur fade"
                                 style="display: none"
                                 aria-hidden="false"
                                 tabindex="-1">
                                <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
                                    <div class="modal-content"></div>
                                </div>
                            </div>

                        </div>
                    </fieldset>
                </div>
            </div>

            <div th:fragment="valueSchemeEditor">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Modal title</h5>
                        </div>
                        <div class="modal-body">
                            <p>Modal body text goes here.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
