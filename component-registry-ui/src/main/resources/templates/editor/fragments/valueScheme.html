<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Value scheme</title>
    </head>

    <body>
        <main>
            <!-- Form component for value scheme (value scheme editor dialog trigger) -->
            <div th:fragment="valueScheme(
                 parentPath, 
                 valueSchemeAttributePath, valueSchemeAttributeValue, 
                 valueSchemePath, valueSchemeValue)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)},
                 containerId = |${TemplateUtils.makeIdSafe(path)}_valueScheme|">
                <div class="valuescheme-container" th:id="${containerId}">

                    <fieldset class="p-1" th:with="
                              baseId=${TemplateUtils.makeIdSafe(basePath)},
                              previewId=|${baseId}_valueSchemePreview|">
                        <label th:for="${previewId}" class="form-label">Type</label>
                        <!--/* Hidden inputs to represent the value scheme definition /*-->
                        <div class="input-group">

                            <!--/* Hidden inputs to represent value scheme definition */-->
                            <div th:replace="~{/editor/fragments/valueScheme :: valueSchemeHiddenInputs(
                                 ${valueSchemeAttributePath}, 
                                 ${valueSchemeAttributeValue}, 
                                 ${valueSchemePath}, 
                                 ${valueSchemeValue})}" />

                            <!--/* TODO: render representation of selected value scheme */-->
                            <input class="form-control" th:id="${previewId}" type="text" th:value="${valueSchemeAttributeValue}" disabled="disabled" />

                            <button
                                class="btn btn-primary"
                                data-bs-toggle="modal" data-bs-target="#valueSchemeModal"
                                th:hx-post="@{/editor/elementValueSchemeEditor(path=${basePath})}"
                                hx-trigger="click" hx-target="#valueSchemeModal">Edit</button>
                        </div>
                    </fieldset>
                </div>
            </div>

            <!-- Hidden inputs representing value scheme definition -->
            <div th:fragment="valueSchemeHiddenInputs(
                 valueSchemeAttributePath, valueSchemeAttributeValue, 
                 valueSchemePath, valueSchemeValue)"
                 class="hidden">
                <input th:if="${valueSchemeAttributeValue} != null" type="hidden"
                       th:name="${valueSchemeAttributePath}" th:value="${valueSchemeAttributeValue}"  />
                <th:block th:if="${valueSchemeValue} != null">
                    <!--/* pattern */-->
                    <input th:if="${valueSchemeValue.pattern} != null" type="hidden"
                           th:name="|${valueSchemePath}.pattern|" th:value="${valueSchemeValue.pattern}" />
                    <!--/* vocabulary */-->
                    <th:block th:if="${valueSchemeValue.vocabulary} != null" th:with="vp = |${valueSchemePath}.vocabulary|, v = ${valueSchemeValue.vocabulary}">
                        <input th:if="${v.uri} != null"  type="hidden"
                               th:name="|${vp}.uri|" th:value="${v.uri}" />
                        <input th:if="${v.valueProperty} != null"  type="hidden"
                               th:name="|${vp}.valueProperty|" th:value="${v.valueProperty}" />
                        <input th:if="${v.valueLanguage} != null"  type="hidden"
                               th:name="|${vp}.valueLanguage|" th:value="${v.valueLanguage}" />
                        <!--/* enumeration */-->
                        <th:block th:if="${v.enumeration} != null" th:with="ep = |${vp}.enumeration|, e = ${v.enumeration}">
                            <input th:if="${e.appinfo} != null"  type="hidden"
                                   th:name="|${ep}.appinfo|" th:value="${e.appinfo}" />
                            <!--/* items */-->
                            <th:block th:each="item, iterStat: ${e.item}" th:with="ip = |${ep}.item[${iterStat.index}]|">
                                <input type="hidden"
                                       th:name="|${ip}.value|" th:value="${item.value}" />
                                <input type="hidden"
                                       th:name="|${ip}.conceptLink|" th:value="${item.conceptLink}" />
                                <!--/* TODO: cues (${item}.otherAttributes) */-->
                            </th:block>
                        </th:block>
                    </th:block>
                </th:block>
            </div>

            <!-- Value scheme editor (dialog content) -->
            <div th:fragment="valueSchemeEditor">
                <div id="value-scheme-editor-dialog" class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Value scheme for [[${parentType}]]</h5>
                        </div>
                        <div class="modal-body"
                             th:x-data="|{valueSchemeForm: '${selectedTab ?: 'simple'}'}|">

                            <!-- /* Tabs for pane (form) selection */ -->
                            <ul class="nav nav-tabs">
                                <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('simple', 'Type')}"></li>
                                <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('pattern', 'Pattern')}"></li>
                                <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('vocabulary', 'Vocabulary')}"></li>
                            </ul>

                            <!-- /* Content for the tab panes (forms for the different value scheme types) */ -->
                            <div class="p-2 border-start border-bottom">
                                <div x-show="valueSchemeForm == 'simple'">
                                    <div th:replace="~{/editor/fragments/valueScheme :: simpleValueScheme(${valueSchemeAttribute})}"></div>
                                </div>

                                <div x-show="valueSchemeForm == 'pattern'">
                                    <div th:replace="~{/editor/fragments/valueScheme :: patternValueScheme(${valueSchemeAttribute})}"></div>
                                </div>

                                <div x-show="valueSchemeForm == 'vocabulary'">
                                    <div th:replace="~{/editor/fragments/valueScheme :: vocabularyValueScheme(${valueSchemeAttribute})}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab items -->
            <ul>
                <li th:fragment="valueSchemeFormTab(tabId, label)" class="nav-item" th:x-data="|{tabId: '${tabId}'}|">
                    <a @click="valueSchemeForm = tabId" href="#value-scheme-editor-dialog"
                        class="nav-link" :class="{active: valueSchemeForm == tabId}" 
                        :aria-current="valueSchemeForm == tabId" 
                        th:text="${label}">
                        label
                    </a>
                </li>
            </ul>

            <!-- Form: simple -->

            <div th:fragment="simpleValueScheme(valueSchemeAttribute)">
                <div class="visually-hidden h4">Simple value scheme</div>
                <p>Value scheme: [[${valueSchemeAttribute}]]</p>
                [TODO: dropdown]
            </div>

            <!-- Form: pattern -->

            <div th:fragment="patternValueScheme(valueSchemeAttribute)">
                <div class="visually-hidden h4">Pattern value scheme</div>
                [TODO: pattern]
            </div>

            <!-- Form: vocabulary -->

            <div th:fragment="vocabularyValueScheme(valueSchemeAttribute)">
                <div class="visually-hidden h4">Vocabulary value scheme</div>
                [TODO: vocabulary]
            </div>
        </main>
    </body>
</html>
