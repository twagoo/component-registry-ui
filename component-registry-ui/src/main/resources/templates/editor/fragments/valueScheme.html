<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Value scheme</title>
    </head>

    <body>
        <main>
            <!-- Form component for value scheme (value scheme editor dialog trigger) -->
            <div th:fragment="valueScheme(
                 parentPath, 
                 valueSchemeAttributePath, valueSchemeAttributeValue, 
                 valueSchemePath, valueSchemeValue)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)}"
                 th:id="|${TemplateUtils.makeIdSafe(parentPath)}_valueScheme|"
                 class="valuescheme-container">
                <fieldset class="p-1" th:with="
                          baseId=${TemplateUtils.makeIdSafe(parentPath)},
                          previewId=|${baseId}_valueSchemePreview|">
                    <label th:for="${previewId}" class="form-label">Type</label>
                    <!--/* Hidden inputs to represent the value scheme definition /*-->
                    <div class="input-group">

                        <!--/* Hidden inputs to represent value scheme definition */-->
                        <div th:replace="~{/editor/fragments/valueScheme :: valueSchemeHiddenInputs(
                             ${valueSchemeAttributePath}, 
                             ${valueSchemeAttributeValue}, 
                             ${valueSchemePath}, 
                             ${valueSchemeValue})}" />

                        <div class="input-group">
                            <th:block th:replace="~{/editor/fragments/valueScheme :: valueSchemePreview(
                                      previewId = ${previewId}, valueSchemeValue = ${valueSchemeValue},
                                      valueSchemeAttributeValue = ${valueSchemeAttributeValue},
                                      maxVocabPreviewSize = 15)}">
                                [preview]
                            </th:block>
                            <button
                                class="btn btn-primary"
                                data-bs-toggle="modal" data-bs-target="#valueSchemeModal"
                                th:hx-post="@{/editor/elementValueSchemeEditor(path=${parentPath})}"
                                hx-trigger="click" hx-target="#valueSchemeModal">Edit</button>
                        </div>
                    </div>
                </fieldset>
            </div>

            <!-- Preview for the value scheme definition -->
            <th:block th:fragment="valueSchemePreview(previewId, valueSchemeAttributeValue, valueSchemeValue, maxVocabPreviewSize)" 
                      th:with="type = (${valueSchemeValue != null &amp;&amp; valueSchemeValue.vocabulary != null}) ? 
                      'vocabulary' : (${valueSchemeValue != null &amp;&amp; valueSchemeValue.getPattern() != null} ? 
                      'pattern' : 'simple')">
                <th:block th:switch="${type}">
                    <!--/* vocabulary type */-->
                    <th:block th:case="'vocabulary'" >
                        <th:block th:replace="~{/editor/fragments/vocabulary :: vocabularyPreview(vocabulary = ${valueSchemeValue.vocabulary})}">
                            [vocabulary]
                        </th:block>
                    </th:block>
                    <!--/* pattern type */-->
                    <input th:case="'pattern'" class="form-control value-scheme-pattern" th:id="${previewId}" type="text" th:value="${valueSchemeValue.getPattern()}" disabled="disabled" />                                
                    <!--/* simple type */-->
                    <input th:case="*"  class="form-control" th:id="${previewId}" type="text" th:value="#{|editor.form.valueScheme.type.${valueSchemeAttributeValue}|}" disabled="disabled" />
                </th:block>
            </th:block>        

            <!-- Hidden inputs representing value scheme definition -->
            <div th:fragment="valueSchemeHiddenInputs(
                 valueSchemeAttributePath, valueSchemeAttributeValue, 
                 valueSchemePath, valueSchemeValue)"
                 class="hidden">
                <input th:if="${valueSchemeAttributeValue} != null" type="hidden"
                       th:name="${valueSchemeAttributePath}" th:value="${valueSchemeAttributeValue}"  />
                <th:block th:if="${valueSchemeValue} != null">
                    <!--/* pattern */-->
                    <input th:if="${valueSchemeValue.pattern != null}" type="hidden"
                           th:name="|${valueSchemePath}.pattern|" th:value="${valueSchemeValue.pattern}" />
                    <!--/* vocabulary */-->
                    <th:block th:replace="~{/editor/fragments/vocabulary :: vocabularyHiddenInputs(valueSchemePath = ${valueSchemePath}, valueSchemeValue = ${valueSchemeValue})}">
                        [vocabulary]
                    </th:block>
                </th:block>
            </div>

            <!-- Value scheme editor (dialog content) -->
            <div th:fragment="valueSchemeEditor(parentType, parentPath, valueSchemeAttribute, valueScheme, selectedTab)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)}"
                 id="value-scheme-editor-dialog"  class="modal-dialog modal-lg modal-dialog-centered" 
                 role="document"
                 hx-indicator="#value-scheme-modal-title-spinner">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="row w-100">
                            <div class="col-11">
                                <span class="modal-title h5">Value scheme for [[${parentType}]]</span>
                            </div>
                            <div class="col-1">
                                <div id="value-scheme-modal-title-spinner" class="spinner-border htmx-indicator" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-body"
                         th:x-data="|{valueSchemeForm: '${selectedTab ?: 'simple'}'}|">

                        <!-- /* Tabs for pane (form) selection */ -->
                        <ul class="nav nav-tabs">
                            <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('simple', 'Type')}"></li>
                            <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('pattern', 'Pattern')}"></li>
                            <li th:replace="~{/editor/fragments/valueScheme :: valueSchemeFormTab('vocabulary', 'Vocabulary')}"></li>
                        </ul>

                        <!-- /* Content for the tab panes (forms for the different value scheme types) */ -->
                        <div class="p-2 border-start border-bottom"
                             th:with="targetId=|${TemplateUtils.makeIdSafe(parentPath)}_valueScheme|">
                            <div x-show="valueSchemeForm == 'simple'">
                                <div th:replace="~{/editor/fragments/valueScheme :: simpleValueScheme(${parentPath}, ${targetId}, ${valueSchemeAttribute})}"></div>
                            </div>

                            <div x-show="valueSchemeForm == 'pattern'">
                                <div th:replace="~{/editor/fragments/valueScheme :: patternValueScheme(${parentPath}, ${targetId}, ${valueScheme})}"></div>
                            </div>

                            <div x-show="valueSchemeForm == 'vocabulary'">
                                <div th:replace="~{/editor/fragments/vocabulary :: vocabularyValueScheme(${parentPath}, ${targetId}, ${valueScheme})}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>

            <!-- Tab items -->
            <ul>
                <li th:fragment="valueSchemeFormTab(tabId, label)" class="nav-item" th:x-data="|{tabId: '${tabId}'}|">
                    <a @click="valueSchemeForm = tabId" href="#value-scheme-editor-dialog"
                        class="nav-link" :class="{active: valueSchemeForm == tabId}" 
                        :aria-current="valueSchemeForm == tabId" 
                        th:text="${label}">
                        label
                    </a>
                </li>
            </ul>

            <!-- Form: simple -->
            <div th:fragment="simpleValueScheme(parentPath, targetId, valueSchemeAttribute)">
                <div class="visually-hidden h4">Simple value scheme</div>
                <form>
                    <div class="m-3">
                        <label for="simpleValueSchemeSelect" class="form-label">Select type:</label>
                        <div class="input-group">
                            <select id="simpleValueSchemeSelect" name="type" class="form-select" aria-label="Selection of simple type to set"
                                    th:with="selectedVal = ${#strings.toString(valueSchemeAttribute) ?: 'STRING'}">
                                <option 
                                    th:each="val : ${
                                    {'ANY_URI', 'BOOLEAN','DECIMAL','FLOAT',
                                    'INT','STRING', 'DATE','TIME','DATE_TIME',
                                    'G_DAY','G_MONTH','G_YEAR'}}"
                                    th:value="${val.toString()}" th:selected="${selectedVal == val}" th:text="#{|editor.form.valueScheme.type.${val}|}">type</option>
                            </select>
                            <button th:replace="~{/editor/fragments/valueScheme :: valueSchemeSubmitButton(
                                    'Use type', 
                                    @{/editor/elementValueSchemeEditor/simple(
                                    path=${parentPath},
                                    uniqId=${#strings.randomAlphanumeric(6)})})}">[use]</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Form: pattern -->
            <div th:fragment="patternValueScheme(parentPath, targetId, valueScheme)">
                <div class="visually-hidden h4">Pattern value scheme</div>
                <form>
                    <div class="m-3">
                        <label for="pattern" class="form-label">Enter pattern:</label>
                        <div class="input-group">
                            <input id="pattern" name="pattern" class="form-control" th:value="${valueScheme == null ? '' : valueScheme.pattern}" />
                            <button th:replace="~{/editor/fragments/valueScheme :: valueSchemeSubmitButton(
                                    'Use pattern', 
                                    @{/editor/elementValueSchemeEditor/pattern(
                                    path=${parentPath},
                                    uniqId=${#strings.randomAlphanumeric(6)})})}">[use pattern]</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Submit button for value scheme that submits the value scheme form and 
                after the request closes the modal IFF the request was successful 
            */-->
            <button th:fragment="valueSchemeSubmitButton(label, postTarget)" class="btn btn-primary" type="submit"
                    th:hx-post="${postTarget}"
                    th:hx-target="|#${targetId}|" hx-swap="outerHTML" 
                    hx-trigger="click" hx-push-url="true"
                    hx-indicator="this"
                    hx-on::after-request="if(event.detail.successful) {
                    bootstrap.Modal.getInstance('#valueSchemeModal').hide();
                    }">
                <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                [[${label}]]
            </button>

        </main>
    </body>
</html>
