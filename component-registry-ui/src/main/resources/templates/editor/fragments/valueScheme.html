<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Value scheme</title>
    </head>

    <body>
        <main>
            <div th:fragment="valueScheme(parentPath, valueSchemeAttribute, valueScheme)"
                 th:with="TemplateUtils=${T(eu.clarin.cmdi.componentregistry.ui.TemplateUtils)},
                 containerId = |${TemplateUtils.makeIdSafe(path)}_valueScheme|">
                <div class="valuescheme-container" th:id="${containerId}">
                    <p>Value scheme type: <pre>[[${valueSchemeAttribute}]]</pre></p>
                    <p>Value scheme: <pre>[[${valueScheme}]]</pre></p>
                </div>
                
            </div>
        </main>
    </body>
</html>
