<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>browser</title> 
    </head>

    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        <div class="container-fluid px-xl-2 px-xxl-5 vh-100">
            <div class="d-flex flex-column h-100">
                <h1 class="py-2 overflow-hidden" style="max-height: 10%;">
                    <span th:text="#{browser.page.title}">{title}</span>
                </h1>
                <div class="d-flex" style="min-height: 90%; max-height: 90%;">
                    <div class="ps-2 pt-2 me-auto">
                        <!-- Sidebar -->
                        <div class="d-flex flex-column h-100">
                            <div class="mb-2 pb-2 border-bottom">
                                <div class="dropdown">
                                    <a class="btn btn-secondary dropdown-toggle" href="#" role="button"
                                       data-bs-toggle="dropdown" aria-expanded="false">
                                        Public
                                    </a>

                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item disabled" href="#">Private</a></li>
                                        <li><a class="dropdown-item disabled" href="#">My team</a></li>
                                        <li><a class="dropdown-item disabled" href="#">Another team</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div>
                                <ul class="nav nav-pills flex-column mb-auto">
                                    <li class="nav-item">
                                        <a href="#" class="nav-link active" aria-current="page">
                                            Profiles
                                        </a>
                                    </li>
                                    <li>
                                        <a href="#" class="nav-link link-body-emphasis">
                                            Components
                                        </a>
                                    </li>
                                </ul>
                            </div>
                            <div class="mt-auto py-2">
                                <a href="#" class="btn btn-secondary">
                                    <i class="fa-solid fa-right-to-bracket"></i>
                                    Log in
                                </a>
                            </div>
                        </div> <!-- END sidebar-->

                    </div>

                    <!-- Table "panel" -->
                    <div id="items-container" class="p-2 h-100 flex-fill ms-auto border rounded">
                        <div id="item-view" class="offcanvas offcanvas-end w-50" tabindex="-1" data-bs-theme="dark">
                            <div class="offcanvas-header">
                                <h5 class="offcanvas-title" id="offcanvasLabel">Item</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                            </div>  
                            <div id="item-viewer-content" class="offcanvas-body">

                            </div>
                        </div>


                        <div class="d-flex flex-column h-100">
                            <div class="d-flex justify-content-between">
                                <div class="p-2">
                                    <h2>Profiles</h2>
                                </div>
                                <div class="p-2">
                                    <a class="btn btn-primary" href="#">
                                        <i class="fa-solid fa-square-plus"></i>
                                        New
                                    </a>
                                </div>
                            </div>
                            <div class="pb-1">
                                <form>
                                    <div class="d-flex flex-wrap">
                                        <div class="px-2 pb-1">
                                            <input type="search" class="form-control" id="table-filter"
                                                   placeholder="Filter items">
                                        </div>
                                        <div class="px-2 pb-1">
                                            <button class="btn btn-outline-secondary" title="Show only recommended"><i
                                                    class="fa-regular fa-star"></i></button>
                                        </div>
                                        <div class="px-2 pb-1">
                                            <div class="dropdown">
                                                <a class="btn btn-outline-secondary dropdown-toggle" href="#" role="button"
                                                   data-bs-toggle="dropdown" aria-expanded="false">
                                                    Group(s)
                                                </a>

                                                <ul class="dropdown-menu">
                                                    <li><a class="dropdown-item" href="#">(All)</a></li>
                                                    <li><a class="dropdown-item" href="#">Recommended</a></li>
                                                    <li><a class="dropdown-item" href="#">..</a></li>
                                                </ul>
                                            </div>
                                        </div>
                                        <div class="px-2 pb-1">
                                            <div class="dropdown">
                                                <a class="btn btn-outline-secondary dropdown-toggle" href="#" role="button"
                                                   data-bs-toggle="dropdown" aria-expanded="false">
                                                    Status
                                                </a>

                                                <ul class="dropdown-menu">
                                                    <li><a class="dropdown-item" href="#">(All)</a></li>
                                                    <li><a class="dropdown-item" href="#">Development</a></li>
                                                    <li><a class="dropdown-item" href="#">Production</a></li>
                                                    <li><a class="dropdown-item" href="#">Deprecated</a></li>
                                                </ul>
                                            </div>
                                        </div>
                                        <div class="htmx-indicator ms-auto" id="table-load-indicator" >
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="p-2 flex-grow-1 overflow-y-auto">
                                <div hx-trigger="load"
                                     th:hx-get="|/items?sortBy=${sortedBy}&sortDirection=${sortedDirection}|"
                                     hx-select="#items-table-wrapper"
                                     hx-swap="innerHTML"
                                     hx-indicator="#items-container">
                                    Items
                                </div>
                            </div>

                        </div>
                    </div> <!-- END table "panel" -->
                </div>
            </div>
        </div>
        </div>
    </body>
</html>
