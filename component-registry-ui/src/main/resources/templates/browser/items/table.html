<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{fragments/base :: head}">
        <title>Items table</title> 
    </head>
    <body>
        <main class="my-2">
            <div class="container">
                <div id="items-table-wrapper" class="table-responsive">
                    <table id="items-table" class="items-table table table-hover table-borderless table-striped mh-100">
                        <!-- Table header with sorting options -->
                        <thead th:replace="~{browser/items/tableHead :: itemsTableHead}"></thead>
                        <!-- Data -->
                        <tbody th:replace="~{browser/items/tableBody :: itemsTableBody}"></tbody>
                    </table>
                </div>
            </div> <!-- container -->
        </main>

    </body>
</html>
